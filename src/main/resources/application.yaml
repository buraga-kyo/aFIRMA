spring:
  ai:
    openai:
      api-key: ${APP_IA_TOKEN_PRINCIPAL:}
      base-url: ${APP_IA_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      chat:
        options:
          model: ${APP_IA_MODEL:gemini-2.5-pro}
  config:
    import: optional:file:./.env[.properties]
  application:
    name: assina
  mail:
    host: ${ASSINEAI_SMTP_HOST:}
    port: ${ASSINEAI_SMTP_PORT:587}
    username: ${ASSINEAI_SMTP_USUARIO:}
    password: ${ASSINEAI_SMTP_SENHA:}
    properties:
      mail.smtp.auth: ${ASSINEAI_SMTP_AUTENTICAR:true}
      mail.smtp.starttls.enable: ${ASSINEAI_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${ASSINEAI_SMTP_STARTTLS:true}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 23MB
      file-size-threshold: 2MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false
server:
  forward-headers-strategy: none
  max-http-request-header-size: 8KB
  tomcat:
    connection-timeout: 5s
app:
  assinatura:
    requisicoes-por-minuto: 30
    assinaturas-simultaneas: 2
