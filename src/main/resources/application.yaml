spring:
  ai:
    openai:
      api-key: ${APP_IA_TOKEN_PRINCIPAL:}
      base-url: ${APP_IA_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      chat:
        options:
          model: ${APP_IA_MODEL:gemini-2.5-pro}
  config:
    import: optional:file:./.env[.properties]
  application:
    name: assina
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 23MB
      file-size-threshold: 2MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false
server:
  max-http-request-header-size: 8KB
  tomcat:
    connection-timeout: 5s
app:
  assinatura:
    requisicoes-por-minuto: 30
    assinaturas-simultaneas: 2
