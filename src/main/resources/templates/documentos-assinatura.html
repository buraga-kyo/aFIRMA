<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentos · AssineAi</title>
  <link rel="stylesheet" href="/css/assinatura.css">
  <link rel="stylesheet" href="/css/tabela-core.css">
  <link rel="stylesheet" href="/css/documentos-assinatura.css">
  <script src="/js/tabela-core.js" defer></script>
  <script src="/js/documentos-assinatura.js" defer></script>
  <link rel="stylesheet" href="/css/trator-firma.css">
</head>
<body class="sistema-trator" th:attr="data-token-teste=${tokenTeste},data-chave-teste=${chaveTeste}">

<main id="pagina-documentos" class="lista-documentos" data-largura="total">
  <div id="tabela-montagem"></div>
  <template id="tabela-comandos">
    <nav class="trator-firma" aria-label="Módulos do Trator da Firma">
  <a class="trator-aba trator-marca" href="/empresa" aria-label="aFIRMA, perfil da empresa">aFIRMA<span>.</span></a>
  <a class="trator-aba" href="/assineai/trator" aria-current="page">AssineAI</a>
  <a class="trator-aba" href="/chat">T@klATIVE</a>
  <a class="trator-aba" href="/advai">ADVai</a>
</nav>
    <a class="acao primaria" href="/preparar-assinaturas">+ Assinatura</a>
    <button id="exportar-dados" type="button">↑ EXPORTAR</button>
    <button id="importar-dados" type="button">↓ IMPORTAR</button>
  </template>
  <template id="tabela-rodape">
    <h1 class="titulo-trator">TRATOR DE <em>ASSINATURA.</em></h1>
    <button id="alternar-largura" type="button" class="acao">▤ TELA INTEIRA</button>
  </template>
  <div id="lista-toast" class="lista-toast" role="alert" hidden></div>

  <dialog id="modal-historico-assinatura" class="modal-exportacao modal-historico" aria-labelledby="titulo-historico-assinatura">
    <h2 id="titulo-historico-assinatura">DOCUMENTOS E HISTÓRICO</h2>
    <div id="conteudo-historico-assinatura" aria-live="polite"></div>
    <form method="dialog" class="modal-acoes"><button type="submit">FECHAR</button></form>
  </dialog>
  <dialog id="modal-exportacao" class="modal-exportacao">
    <div class="modal-conteudo">
      <h2>Exportar Dados</h2>
      <p id="export-msg"></p>
      <div class="form-grupo" id="botoes-formato-export" style="display: flex; gap: 8px; justify-content: center; margin: 16px 0;">
        <button type="button" class="acao secundario" data-formato="pdf">PDF (Lista crua)</button>
        <button type="button" class="acao secundario" data-formato="excel">Excel</button>
        <button type="button" class="acao secundario" data-formato="csv">CSV</button>
      </div>
      <div class="form-grupo">
        <label><input type="checkbox" id="export-concordo"> Concordo em exportar <span id="export-qtd"></span> registros</label>
      </div>
      <div class="modal-acoes">
        <button id="btn-cancelar-export" type="button">Cancelar</button>
      </div>
    </div>
  </dialog>

  <dialog id="modal-importacao" class="modal-exportacao">
    <div class="modal-conteudo">
      <h2>Importar Dados</h2>
      <p>Faça o download do <a href="/modelo-importacao.csv" download>modelo de planilha</a> contendo uma linha de exemplo.</p>
      <div class="form-grupo" style="margin: 16px 0; border: 2px dashed var(--borda); padding: 32px; text-align: center; border-radius: 8px;">
        <label for="input-arquivo-importacao" style="cursor: pointer; display: block;">
          <strong>Arraste e solte o arquivo aqui</strong> ou clique para selecionar
        </label>
        <input type="file" id="input-arquivo-importacao" accept=".csv,.xlsx" style="display: none;">
      </div>
      <div class="modal-acoes">
        <button id="btn-cancelar-import" type="button">Cancelar</button>
      </div>
    </div>
  </dialog>
</main>

<div class="rodape-fixo-trator">
  <section class="acesso-lista acesso-lista-rodape" aria-label="Acesso à lista">
    <label>CHAVE DA API <input id="lista-chave" type="password" autocomplete="off" placeholder="Chave da API"></label>
    <label>TOKEN JWT <input id="lista-token" type="password" autocomplete="off" placeholder="Cole seu JWT"></label>
    <div class="origem-rodape"><label for="fonte-assinaturas" class="sr-only">Origem dos registros</label><select id="fonte-assinaturas"><option value="legado">Assineai: estrutura de produção</option><option value="firma">Registros anteriores da Firma</option></select></div>
    <button id="lista-conectar" type="button" class="acao primaria">✓ CONECTAR</button>
    <button id="usar-credenciais-teste" type="button" class="acao">Credenciais de teste</button>
  </section>
</div>
</body>
</html>
