<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empresa · aFIRMA</title><link rel="stylesheet" href="/css/assinatura.css"><link rel="stylesheet" href="/css/envelopes.css"><script src="/js/empresa-assineai.js" defer></script>
</head><body>
  <header class="topo"><a class="marca" href="/">aFIRMA<span class="marca-ponto">.</span></a><span class="topo-selo">SUA EMPRESA</span></header>
<main>
<section class="apresentacao"><div><span class="sobretitulo">ASSINEAI NA FIRMA</span><h1>SUA EMPRESA.<br><span>SEU JEITO.</span></h1><p>Acesse sua conta e mantenha os dados e o tema da assinatura.</p></div></section>
<div id="mensagem-empresa" class="erro" role="status" hidden></div>
<section class="area-trabalho"><div class="cabecalho-area">ACESSO</div><form id="login-empresa" class="etapa campos"><div class="campo"><label for="login-email">E-MAIL</label><input id="login-email" type="email" autocomplete="username" required maxlength="254"></div><div class="campo"><label for="login-senha">SENHA</label><input id="login-senha" type="password" autocomplete="current-password" required maxlength="72"></div><button class="botao-carteira" type="submit">ENTRAR</button></form>
<details class="etapa"><summary>CRIAR CONTA</summary><form id="registro-empresa" class="campos"><div class="campo"><label for="registro-usuario">USUÁRIO</label><input id="registro-usuario" autocomplete="username" required maxlength="120"></div><div class="campo"><label for="registro-email">E-MAIL</label><input id="registro-email" type="email" autocomplete="email" required maxlength="254"></div><div class="campo"><label for="registro-senha">SENHA</label><input id="registro-senha" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div><button class="botao-carteira" type="submit">CADASTRAR</button></form></details>
<details class="etapa"><summary>ACESSO TÉCNICO OU JWT EXISTENTE</summary><div class="campo"><label for="empresa-token">TOKEN JWT</label><input id="empresa-token" type="password" autocomplete="off"></div><button id="carregar-empresa" class="botao-carteira" type="button">CARREGAR EMPRESA</button></details></section>
<section id="perfil-empresa" class="area-trabalho" hidden><div class="cabecalho-area">DADOS E APARÊNCIA</div><form id="dados-empresa" class="etapa campos"><div class="campo campo-largo"><label for="perfil-nome">NOME DA EMPRESA</label><input id="perfil-nome" maxlength="255" required></div><div class="campo"><label for="perfil-cnpj">CNPJ</label><input id="perfil-cnpj" maxlength="18"></div><div class="campo"><label for="perfil-email">E-MAIL</label><input id="perfil-email" type="email" maxlength="254"></div><div class="campo campo-largo"><label for="perfil-tema">TEMA DA ASSINATURA</label><select id="perfil-tema"><option value="firma">Firma</option><option value="Caderno">Caderno</option><option value="Cor Solida">Cor sólida</option></select></div><button class="botao-carteira" type="submit">SALVAR EMPRESA</button><a class="botao-carteira" href="/preparar-assinaturas">PREPARAR ASSINATURA ↗</a></form></section></main></body></html>
